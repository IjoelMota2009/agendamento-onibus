<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transporte Saúde - Carro</title>

    <style>
        :root {
            --primary: #166534;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f4f7f6;
            --dark: #1a1a1a;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .header {
            background: var(--dark);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .header a {
            color: #bbf7d0;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .card h3 {
            margin-top: 0;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
            color: var(--primary);
        }

        
        .header-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .header-card h3 {
            margin: 0;
            border-bottom: none;
            padding-bottom: 0;
            color: var(--primary);
        }

        .btn-config {
            background: #334155;
            color: white;
            width: auto;
            padding: 7px 10px;
            font-size: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-config:hover {
            opacity: 0.9;
        }
.form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .check-box-group {
            display: flex;
            gap: 10px;
            grid-column: span 2;
        }

        .check-box {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #eee;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }

        .btn-save {
            background: var(--success);
            width: 100%;
            margin-top: 10px;
        }

        .btn-cancel-edit {
            background: #64748b;
            width: 100%;
            margin-top: 8px;
            display: none;
        }
.config-panel {
            display: none;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .config-panel h4 {
            margin: 0 0 10px 0;
            color: #166534;
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-config-save {
            background: #166534;
            width: 100%;
            margin-top: 10px;
        }

        .btn-view {
            background: #4b5563;
            width: 100%;
            margin-top: 10px;
        }

        .btn-print {
            background: var(--primary);
            width: 100%;
            height: 50px;
            font-size: 16px;
            margin-top: 20px;
        }

        .btn-edit {
            background: #dbeafe;
            color: #1d4ed8;
            padding: 5px 8px;
            border: 1px solid #bfdbfe;
            font-size: 11px;
            margin-left: 5px;
        }

        .btn-toggle {
            background: #fef3c7;
            color: #92400e;
            padding: 5px 8px;
            border: 1px solid #fde68a;
            font-size: 11px;
            margin-left: 5px;
        }

        .btn-del {
            background: #fee2e2;
            color: #dc2626;
            padding: 5px 8px;
            border: 1px solid #fecaca;
            font-size: 11px;
            margin-left: 5px;
        }

        .vagas-box {
            padding: 18px;
            border-radius: 8px;
            text-align: center;
            color: white;
            background: #16a34a;
            margin-bottom: 15px;
        }

        .vagas-numero {
            font-size: 28px;
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }

        #listaConfirmacao {
            background: #fff;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .search-box {
            margin-bottom: 15px;
        }

        .search-box input {
            border: 2px solid var(--primary);
            background: #f0fdf4;
            font-weight: bold;
        }

        .item-confirmar {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            margin-bottom: 6px;
            background: #fff;
        }

        .item-cancelado {
            opacity: 0.6;
            background: #f8fafc;
        }

        .nome-paciente {
            flex: 1;
            font-weight: 500;
            font-size: 15px;
            text-transform: uppercase;
        }

        .hora-paciente {
            width: 70px;
            text-align: center;
            font-weight: bold;
            color: #475569;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 4px;
            margin: 0 10px;
        }

        .tag {
            font-size: 9px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 3px;
            margin-left: 5px;
            vertical-align: middle;
        }

        .tag-ok {
            color: #059669;
            border: 1px solid #059669;
        }

        .tag-cancelado {
            color: #dc2626;
            border: 1px solid #dc2626;
        }

        .tag-acomp {
            color: #7c3aed;
            border: 1px solid #7c3aed;
        }

        .tag-carro-baixo {
            color: #b45309;
            border: 1px solid #b45309;
        }

        .tag-crianca {
            color: #db2777;
            border: 1px solid #db2777;
        }

        .tag-fixo {
            color: #2563eb;
            border: 1px solid #2563eb;
        }

        .status-box {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .status-ok {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .status-erro {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .status-info {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
        }

        .editando-box {
            display: none;
            background: #fff7ed;
            color: #9a3412;
            border: 1px solid #fed7aa;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        @media (max-width: 850px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        @media print {
            .no-print {
                display: none !important;
            }

            body {
                padding: 0;
                background: white;
            }

            .onibus-section {
                page-break-before: always;
                margin-bottom: 25px;
            }

            .onibus-section:first-child {
                page-break-before: auto;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 10px;
            }

            th,
            td {
                border: 1px solid #000;
                padding: 6px;
                text-align: left;
                font-size: 11px;
            }

            th {
                background: #f2f2f2 !important;
                -webkit-print-color-adjust: exact;
            }

            .header-print {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                border-bottom: 2px solid #000;
                padding-bottom: 5px;
            }
        }
    
/* Ajuste geral de impressão: oculta usuário logado, botão sair e controles */
@media print {
    #caixaUsuarioSistema,
    #btnSairSistema,
    .no-print {
        display: none !important;
    }
}

</style>
</head>

<body>
    <div class="container">
        <div class="header no-print">
            <h1>SISTEMA DE TRANSPORTE - CARRO</h1>
            <a href="index.html">← Voltar ao menu</a>
        </div>

        <div class="main-grid no-print">
            <div class="card">
                <h3>1. Cadastrar Paciente - Carro</h3>

                <div id="editandoBox" class="editando-box"></div>

                <div class="form-row">
                    <div style="grid-column: span 2;">
                        <label for="data">Data da Viagem:</label>
                        <input type="date" id="data">
                    </div>

                    <div style="grid-column: span 2;">
                        <label for="paciente">Nome do Paciente:</label>
                        <input type="text" id="paciente" placeholder="Nome Completo">
                    </div>

                    <div>
                        <label for="telefone">Telefone:</label>
                        <input type="text" id="telefone" placeholder="(00) 00000-0000">
                    </div>

                    <div>
                        <label for="localBusca">Onde buscar:</label>
                        <input type="text" id="localBusca" placeholder="Casa, rua, bairro, referência...">
                    </div>

                    <div>
                        <label for="lugar">Destino:</label>
                        <input type="text" id="lugar" placeholder="Ex: ICL, CIA, hospital, clínica...">
                    </div>

                    <div>
                        <label for="horario">Horário:</label>
                        <input type="time" id="horario">
                    </div>

                    <div>
                        <label for="obs">Observação:</label>
                        <input type="text" id="obs" placeholder="Cadeira de rodas, detalhe, referência...">
                    </div>

                    <div class="check-box-group">
                        <div class="check-box">
                            <input type="checkbox" id="acompanhante">
                            <label for="acompanhante">Com Acompanhante</label>
                        </div>

                        <div class="check-box">
                            <input type="checkbox" id="carroBaixo">
                            <label for="carroBaixo">Vai de carro baixo</label>
                        </div>

                        <div class="check-box">
                            <input type="checkbox" id="crianca">
                            <label for="crianca">Criança / bebê conforto</label>
                        </div>

                        <div class="check-box">
                            <input type="checkbox" id="fixo">
                            <label for="fixo">Paciente fixo</label>
                        </div>
                    </div>
                </div>

                <button class="btn btn-save" id="btnSalvar">SALVAR AGENDAMENTO</button>
                <button class="btn btn-cancel-edit" id="btnCancelarEdicao">CANCELAR EDIÇÃO</button>

                <div id="statusMensagem" class="status-box"></div>
            </div>

            <div class="card">
                <div class="header-card">
                    <h3>2. Controle do Dia</h3>
                    <button class="btn btn-config" id="btnAbrirConfig" type="button">⚙️ Configurações</button>
                </div>

                <div class="config-panel" id="painelConfig">
                    <h4>Configuração do Carro</h4>
                    <div class="config-grid">
                        <div>
                            <label for="configVagasTotal">Vagas totais do dia:</label>
                            <input type="number" id="configVagasTotal" min="1" value="20">
                        </div>
                        <div>
                            <label for="configCapacidadeCarro">Capacidade por carro:</label>
                            <input type="number" id="configCapacidadeCarro" min="1" value="4">
                        </div>
                    </div>
                    <button class="btn btn-config-save" id="btnSalvarConfig" type="button">SALVAR CONFIGURAÇÃO</button>
                </div>

                <div id="statusData" style="text-align: center; font-weight: bold; margin-bottom: 15px; color: var(--primary);">
                    Selecione uma data
                </div>

                <div class="vagas-box">
                    <span>CARRO - VAGAS CONFIRMADAS</span>
                    <span class="vagas-numero" id="vCarro">0 / 20</span>
                </div>

                <button class="btn btn-view" id="btnVerLista">VER LISTA E PESQUISAR</button>

                <div id="listaConfirmacao">
                    <div class="search-box">
                        <input type="text" id="inputBusca" placeholder="🔍 Pesquisar nome na lista...">
                    </div>

                    <div id="corpoLista"></div>

                    <button class="btn btn-print" id="btnGerarRelatorio">GERAR PLANILHA PARA IMPRESSÃO</button>
                </div>
            </div>
        </div>

        <div id="relatorioArea"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getFirestore,
            collection,
            addDoc,
            query,
            where,
            updateDoc,
            doc,
            setDoc,
            Timestamp,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // =====================================================
        // CONFIGURAÇÃO DO FIREBASE
        // =====================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBEewfcj1MzE-OEoSv2YERkyU8TAXQZWFY",
            authDomain: "agendamento-a11d3.firebaseapp.com",
            projectId: "agendamento-a11d3",
            storageBucket: "agendamento-a11d3.firebasestorage.app",
            messagingSenderId: "31776903316",
            appId: "1:31776903316:web:73b72839fe54ce0d04a481"
        };

        const app = initializeApp(firebaseConfig);
        const firestore = getFirestore(app);

        // Coleção separada do sistema de ônibus.
        const COLECAO = 'agendamentos_carro';
        const COLECAO_CONFIG = 'configuracoes';
        const DOC_CONFIG_CARRO = 'carro';

        let limiteCarro = 20;
        let capacidadePorCarro = 4;

        // =====================================================
        // ESTADO DA TELA
        // =====================================================
        let db = [];
        let dataAtual = '';
        let unsubscribeAtual = null;
        let listaAberta = false;
        let salvando = false;
        let editandoId = null;

        // =====================================================
        // ELEMENTOS DA TELA
        // =====================================================
        const el = {
            data: document.getElementById('data'),
            paciente: document.getElementById('paciente'),
            telefone: document.getElementById('telefone'),
            localBusca: document.getElementById('localBusca'),
            lugar: document.getElementById('lugar'),
            horario: document.getElementById('horario'),
            obs: document.getElementById('obs'),
            acompanhante: document.getElementById('acompanhante'),
            carroBaixo: document.getElementById('carroBaixo'),
            crianca: document.getElementById('crianca'),
            fixo: document.getElementById('fixo'),
            btnSalvar: document.getElementById('btnSalvar'),
            btnCancelarEdicao: document.getElementById('btnCancelarEdicao'),
            btnVerLista: document.getElementById('btnVerLista'),
            btnGerarRelatorio: document.getElementById('btnGerarRelatorio'),
            inputBusca: document.getElementById('inputBusca'),
            statusMensagem: document.getElementById('statusMensagem'),
            statusData: document.getElementById('statusData'),
            vCarro: document.getElementById('vCarro'),
            btnAbrirConfig: document.getElementById('btnAbrirConfig'),
            painelConfig: document.getElementById('painelConfig'),
            configVagasTotal: document.getElementById('configVagasTotal'),
            configCapacidadeCarro: document.getElementById('configCapacidadeCarro'),
            btnSalvarConfig: document.getElementById('btnSalvarConfig'),
            listaConfirmacao: document.getElementById('listaConfirmacao'),
            corpoLista: document.getElementById('corpoLista'),
            relatorioArea: document.getElementById('relatorioArea'),
            editandoBox: document.getElementById('editandoBox')
        };

        // =====================================================
        // FUNÇÕES UTILITÁRIAS
        // =====================================================
        function mostrarStatus(texto, tipo = 'ok', tempo = 4000) {
            el.statusMensagem.textContent = texto;
            el.statusMensagem.className = `status-box ${
                tipo === 'erro' ? 'status-erro' : tipo === 'info' ? 'status-info' : 'status-ok'
            }`;
            el.statusMensagem.style.display = 'block';

            if (tempo > 0) {
                setTimeout(() => {
                    if (el.statusMensagem.textContent === texto) {
                        el.statusMensagem.style.display = 'none';
                    }
                }, tempo);
            }
        }

        function normalizar(texto) {
            return (texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[çÇ]/g, 'C').trim().toUpperCase();
        }

        function limparCampos() {
            el.paciente.value = '';
            el.telefone.value = '';
            el.localBusca.value = '';
            el.lugar.value = '';
            el.horario.value = '';
            el.obs.value = '';
            el.acompanhante.checked = false;
            el.carroBaixo.checked = false;
            el.crianca.checked = false;
            el.fixo.checked = false;
        }

        function contarConfirmados(lista = db) {
            return lista
                .filter(item => item.status === 'ativo' && item.confirmado)
                .reduce((total, item) => total + pesoVagas(item), 0);
        }

        function ordenar(lista) {
            return [...lista].sort((a, b) => {
                const lugarA = normalizar(a.lugar);
                const lugarB = normalizar(b.lugar);

                if (lugarA !== lugarB) {
                    return lugarA.localeCompare(lugarB);
                }

                const horarioA = a.horario || '';
                const horarioB = b.horario || '';

                if (horarioA !== horarioB) {
                    return horarioA.localeCompare(horarioB);
                }

                return normalizar(a.paciente).localeCompare(normalizar(b.paciente));
            });
        }

        function pesoVagas(item) {
            let vagas = 1;
            if (item.acompanhante === 'SIM') vagas += 1;
            if (item.crianca === 'SIM') vagas += 1;
            return vagas;
        }

        function vagasUsadas(lista) {
            return lista.reduce((total, item) => total + pesoVagas(item), 0);
        }

        function horarioParaMinutos(horario) {
            if (!horario) return null;
            const partes = horario.split(':').map(Number);
            if (partes.length < 2 || Number.isNaN(partes[0]) || Number.isNaN(partes[1])) return null;
            return partes[0] * 60 + partes[1];
        }

        function dentroDaJanelaDeDuasHoras(pacientes, novoPaciente) {
            const horarios = [...pacientes, novoPaciente]
                .map(item => horarioParaMinutos(item.horario))
                .filter(valor => valor !== null);

            if (horarios.length <= 1) return true;

            const menor = Math.min(...horarios);
            const maior = Math.max(...horarios);
            return (maior - menor) <= 120;
        }

        function precisaCarroBaixo(grupo) {
            return grupo.some(item => item.carroBaixo === 'SIM');
        }

        function tentarAdicionarNoCarro(carro, item) {
            const total = vagasUsadas(carro.pacientes) + pesoVagas(item);
            if (total > capacidadePorCarro) return false;
            if (!dentroDaJanelaDeDuasHoras(carro.pacientes, item)) return false;
            carro.pacientes.push(item);
            return true;
        }

        function montarCarros(lista) {
            const confirmados = ordenar(lista.filter(item => item.status === 'ativo' && item.confirmado));
            const porDestino = new Map();

            for (const item of confirmados) {
                const destino = normalizar(item.lugar) || 'SEM DESTINO';
                if (!porDestino.has(destino)) porDestino.set(destino, []);
                porDestino.get(destino).push(item);
            }

            const carros = [];
            let numeroCarro = 1;

            for (const [, pacientesDestino] of porDestino) {
                const pacientesOrdenados = [...pacientesDestino].sort((a, b) => {
                    const baixoA = a.carroBaixo === 'SIM' ? 0 : 1;
                    const baixoB = b.carroBaixo === 'SIM' ? 0 : 1;
                    if (baixoA !== baixoB) return baixoA - baixoB;
                    return (a.horario || '').localeCompare(b.horario || '') || normalizar(a.paciente).localeCompare(normalizar(b.paciente));
                });

                for (const paciente of pacientesOrdenados) {
                    let colocado = false;

                    for (const carro of carros) {
                        const mesmoDestino = carro.pacientes.some(p => normalizar(p.lugar) === normalizar(paciente.lugar));
                        if (!mesmoDestino) continue;
                        if (paciente.carroBaixo === 'SIM' && carro.tipoPreferencial !== 'CARRO BAIXO') continue;

                        if (tentarAdicionarNoCarro(carro, paciente)) {
                            if (paciente.carroBaixo === 'SIM') carro.tipoPreferencial = 'CARRO BAIXO';
                            colocado = true;
                            break;
                        }
                    }

                    if (!colocado) {
                        const novoCarro = {
                            numero: numeroCarro++,
                            tipoPreferencial: paciente.carroBaixo === 'SIM' ? 'CARRO BAIXO' : '',
                            pacientes: []
                        };
                        tentarAdicionarNoCarro(novoCarro, paciente);
                        carros.push(novoCarro);
                    }
                }
            }

            const compactados = [];

            for (const carro of carros) {
                let unido = false;

                for (const destino of compactados) {
                    const sobra = capacidadePorCarro - vagasUsadas(destino.pacientes);
                    const pesoCarro = vagasUsadas(carro.pacientes);

                    if (pesoCarro > sobra) continue;
                    if (precisaCarroBaixo(carro.pacientes) && destino.tipoPreferencial !== 'CARRO BAIXO') continue;

                    const horariosCompativeis = carro.pacientes.every(paciente =>
                        dentroDaJanelaDeDuasHoras(destino.pacientes, paciente)
                    );
                    if (!horariosCompativeis) continue;

                    destino.pacientes.push(...carro.pacientes);
                    if (precisaCarroBaixo(carro.pacientes)) destino.tipoPreferencial = 'CARRO BAIXO';
                    unido = true;
                    break;
                }

                if (!unido) compactados.push(carro);
            }

            return compactados.map((carro, index) => ({
                ...carro,
                numero: index + 1,
                pacientes: ordenar(carro.pacientes)
            }));
        }

        // =====================================================
        // RENDERIZAÇÃO DA TELA
        // =====================================================
        function renderizarPainel() {
            if (!dataAtual) {
                el.statusData.innerText = 'Selecione uma data';
                el.vCarro.innerText = `0 / ${limiteCarro}`;
                return;
            }

            el.statusData.innerText = 'DATA: ' + dataAtual.split('-').reverse().join('/');
            el.vCarro.innerText = `${contarConfirmados()} / ${limiteCarro}`;
        }

        function renderizarLista() {
            if (!listaAberta) return;

            const busca = normalizar(el.inputBusca.value);
            const ativos = ordenar(db.filter(item => item.status === 'ativo'));

            const filtrados = ativos.filter(item => {
                return !busca ||
                    normalizar(item.paciente).includes(busca) ||
                    normalizar(item.lugar).includes(busca) ||
                    normalizar(item.localBusca).includes(busca);
            });

            el.corpoLista.innerHTML = '';

            if (filtrados.length === 0) {
                el.corpoLista.innerHTML = '<div style="padding:10px;color:#64748b">Nenhum paciente encontrado.</div>';
                return;
            }

            for (const item of filtrados) {
                const div = document.createElement('div');
                div.className = 'item-confirmar' + (!item.confirmado ? ' item-cancelado' : '');

                const nome = document.createElement('div');
                nome.className = 'nome-paciente';
                nome.innerHTML = `
                    ${item.paciente || ''}
                    ${item.confirmado
                        ? '<span class="tag tag-ok">CONFIRMADO</span>'
                        : '<span class="tag tag-cancelado">DESMARCADO</span>'}
                    ${item.acompanhante === 'SIM'
                        ? '<span class="tag tag-acomp">+ACOMP</span>'
                        : ''}
                    ${item.carroBaixo === 'SIM'
                        ? '<span class="tag tag-carro-baixo">CARRO BAIXO</span>'
                        : ''}
                    ${item.crianca === 'SIM'
                        ? '<span class="tag tag-crianca">CRIANÇA</span>'
                        : ''}
                    ${item.fixo === 'SIM'
                        ? '<span class="tag tag-fixo">FIXO</span>'
                        : ''}
                    <br>
                    <small style="font-weight:400;color:#64748b">
                        <b>Busca:</b> ${item.localBusca || ''}
                        &nbsp; | &nbsp;
                        <b>Destino:</b> ${item.lugar || ''}
                        ${item.obs ? ' - ' + item.obs : ''}
                    </small>
                `;

                const hora = document.createElement('div');
                hora.className = 'hora-paciente';
                hora.textContent = item.horario || '';

                const btnEditar = document.createElement('button');
                btnEditar.className = 'btn btn-edit';
                btnEditar.textContent = 'Editar';
                btnEditar.addEventListener('click', () => iniciarEdicao(item.id));

                const btnToggle = document.createElement('button');
                btnToggle.className = 'btn btn-toggle';
                btnToggle.textContent = item.confirmado ? 'Desmarcar' : 'Confirmar';
                btnToggle.addEventListener('click', () => alternarConfirmacao(item.id));

                const btnApagar = document.createElement('button');
                btnApagar.className = 'btn btn-del';
                btnApagar.textContent = 'Apagar';
                btnApagar.addEventListener('click', () => excluir(item.id));

                div.append(nome, hora, btnEditar, btnToggle, btnApagar);
                el.corpoLista.appendChild(div);
            }
        }

        function atualizarTela() {
            renderizarPainel();
            renderizarLista();
        }


        // =====================================================
        // CONFIGURAÇÕES DO CARRO
        // =====================================================
        function aplicarConfiguracaoNaTela() {
            el.configVagasTotal.value = limiteCarro;
            el.configCapacidadeCarro.value = capacidadePorCarro;
            atualizarTela();
        }

        function iniciarEscutaConfiguracao() {
            onSnapshot(
                doc(firestore, COLECAO_CONFIG, DOC_CONFIG_CARRO),
                snapshot => {
                    if (snapshot.exists()) {
                        const config = snapshot.data();
                        limiteCarro = Number(config.vagasTotal) || 20;
                        capacidadePorCarro = Number(config.capacidadeCarro) || 4;
                    } else {
                        limiteCarro = 20;
                        capacidadePorCarro = 4;
                    }
                    aplicarConfiguracaoNaTela();
                },
                erro => {
                    console.error(erro);
                    mostrarStatus('Erro ao carregar configurações: ' + erro.message, 'erro', 6000);
                }
            );
        }

        function alternarPainelConfiguracao() {
            el.painelConfig.style.display = el.painelConfig.style.display === 'block' ? 'none' : 'block';
        }

        async function salvarConfiguracao() {
        if (!window.podeConfigurarSistema?.()) { alert('Você não tem permissão para alterar configurações.'); return; }
            const novasVagas = Number(el.configVagasTotal.value);
            const novaCapacidade = Number(el.configCapacidadeCarro.value);

            if (!novasVagas || novasVagas < 1 || !novaCapacidade || novaCapacidade < 1) {
                alert('Informe valores válidos para as configurações.');
                return;
            }

            try {
                await setDoc(doc(firestore, COLECAO_CONFIG, DOC_CONFIG_CARRO), {
                    vagasTotal: novasVagas,
                    capacidadeCarro: novaCapacidade,
                    atualizadoEm: Timestamp.now()
                }, { merge: true });

                await window.registrarLog?.({ acao: 'alterou_configuracao', modulo: 'carro', detalhes: `Vagas: ${novasVagas} | Capacidade por carro: ${novaCapacidade}` });
                mostrarStatus('Configuração salva com sucesso.');
                el.painelConfig.style.display = 'none';
            } catch (erro) {
                console.error(erro);
                alert('Erro ao salvar configuração: ' + erro.message);
                mostrarStatus('Erro ao salvar configuração.', 'erro', 6000);
            }
        }

        // =====================================================
        // FIREBASE - ESCUTAR DADOS DA DATA SELECIONADA
        // =====================================================
        function iniciarEscutaData(data) {
            dataAtual = data;
            db = [];
            atualizarTela();

            if (!data) return;

            if (unsubscribeAtual) {
                unsubscribeAtual();
                unsubscribeAtual = null;
            }

            mostrarStatus('Carregando dados da data selecionada...', 'info', 1500);

            const q = query(
                collection(firestore, COLECAO),
                where('data', '==', data)
            );

            unsubscribeAtual = onSnapshot(
                q,
                snapshot => {
                    db = snapshot.docs.map(documento => ({
                        id: documento.id,
                        ...documento.data()
                    }));
                    atualizarTela();
                },
                erro => {
                    console.error(erro);
                    mostrarStatus('Erro ao carregar dados: ' + erro.message, 'erro', 6000);
                }
            );
        }

        // =====================================================
        // FORMULÁRIO - VALIDAÇÃO E SALVAMENTO
        // =====================================================
        function pegarDadosFormulario() {
            const data = el.data.value;
            const paciente = normalizar(el.paciente.value);
            const horario = el.horario.value;

            if (!data || !paciente || !horario) {
                alert('Preencha Nome, Data e Horário!');
                return null;
            }

            return {
                data,
                paciente,
                telefone: el.telefone.value.trim(),
                localBusca: normalizar(el.localBusca.value),
                lugar: normalizar(el.lugar.value),
                horario,
                obs: normalizar(el.obs.value),
                acompanhante: el.acompanhante.checked ? 'SIM' : 'NÃO',
                carroBaixo: el.carroBaixo.checked ? 'SIM' : 'NÃO',
                crianca: el.crianca.checked ? 'SIM' : 'NÃO',
                fixo: el.fixo.checked ? 'SIM' : 'NÃO'
            };
        }

        function verificarDuplicidade(dados) {
            return db.find(item => {
                return item.status === 'ativo' &&
                    item.id !== editandoId &&
                    normalizar(item.paciente) === dados.paciente;
            });
        }

        async function salvar() {
            if (salvando) return;

            const dados = pegarDadosFormulario();
            if (!dados) return;

            if (dataAtual !== dados.data) {
                iniciarEscutaData(dados.data);
            }

            const repetido = verificarDuplicidade(dados);
            if (repetido) {
                alert('ESTE PACIENTE JÁ ESTÁ CADASTRADO NESTA DATA!');
                return;
            }

            salvando = true;
            el.btnSalvar.classList.add('loading');
            el.btnSalvar.textContent = editandoId ? 'SALVANDO EDIÇÃO...' : 'SALVANDO...';

            try {
                if (editandoId) {
                    await updateDoc(doc(firestore, COLECAO, editandoId), {
                        ...dados,
                        atualizadoEm: Timestamp.now()
                    });

                    await window.registrarLog?.({ acao: 'editou_agendamento', modulo: 'carro', paciente: dados.paciente, dataRegistro: dados.data, detalhes: `Horário: ${dados.horario} | Destino: ${dados.lugar}` });
                    mostrarStatus('Agendamento editado com sucesso.');
                    cancelarEdicao(false);
                    return;
                }

                let confirmado = true;
                const vagasSeConfirmar = contarConfirmados() + pesoVagas(dados);

                if (vagasSeConfirmar > limiteCarro) {
                    const continuar = confirm('As vagas confirmadas já estão preenchidas. Salvar como DESMARCADO?');
                    if (!continuar) return;
                    confirmado = false;
                }

                await addDoc(collection(firestore, COLECAO), {
                    ...dados,
                    confirmado,
                    status: 'ativo',
                    criadoEm: Timestamp.now(),
                    excluidoEm: null,
                    motivoExclusao: null
                });

                limparCampos();
                await window.registrarLog?.({ acao: 'cadastrou_agendamento', modulo: 'carro', paciente: dados.paciente, dataRegistro: dados.data, detalhes: `Horário: ${dados.horario} | Destino: ${dados.lugar}` });
                mostrarStatus('Agendamento salvo com sucesso.');
            } catch (erro) {
                console.error(erro);
                alert('Erro ao salvar: ' + erro.message);
                mostrarStatus('Erro ao salvar: ' + erro.message, 'erro', 6000);
            } finally {
                salvando = false;
                el.btnSalvar.classList.remove('loading');
                el.btnSalvar.textContent = editandoId ? 'SALVAR EDIÇÃO' : 'SALVAR AGENDAMENTO';
            }
        }

        // =====================================================
        // EDIÇÃO
        // =====================================================
        function iniciarEdicao(id) {
            const item = db.find(registro => registro.id === id);
            if (!item) return;

            editandoId = id;

            el.data.value = item.data || '';
            el.paciente.value = item.paciente || '';
            el.telefone.value = item.telefone || '';
            el.localBusca.value = item.localBusca || '';
            el.lugar.value = item.lugar || '';
            el.horario.value = item.horario || '';
            el.obs.value = item.obs || '';
            el.acompanhante.checked = item.acompanhante === 'SIM';
            el.carroBaixo.checked = item.carroBaixo === 'SIM';
            el.crianca.checked = item.crianca === 'SIM';
            el.fixo.checked = item.fixo === 'SIM';

            el.btnSalvar.textContent = 'SALVAR EDIÇÃO';
            el.btnCancelarEdicao.style.display = 'block';
            el.editandoBox.textContent = 'Editando: ' + (item.paciente || '');
            el.editandoBox.style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicao(limpar = true) {
            editandoId = null;
            el.btnSalvar.textContent = 'SALVAR AGENDAMENTO';
            el.btnCancelarEdicao.style.display = 'none';
            el.editandoBox.style.display = 'none';

            if (limpar) limparCampos();
        }

        // =====================================================
        // CONFIRMAR / DESMARCAR / EXCLUIR
        // =====================================================
        async function alternarConfirmacao(id) {
            const item = db.find(registro => registro.id === id);
            if (!item) return;

            const novoValor = !item.confirmado;

            if (!novoValor) {
                const ok = confirm(`Tem certeza que quer DESMARCAR ${item.paciente || 'este paciente'}?`);
                if (!ok) return;
            }

            if (novoValor && (contarConfirmados() + pesoVagas(item)) > limiteCarro) {
                alert('Limite de ' + limiteCarro + ' vagas confirmadas atingido.');
                return;
            }

            const backup = item.confirmado;
            item.confirmado = novoValor;
            atualizarTela();

            try {
                await updateDoc(doc(firestore, COLECAO, id), {
                    confirmado: novoValor,
                    atualizadoEm: Timestamp.now()
                });
                await window.registrarLog?.({ acao: novoValor ? 'confirmou_agendamento' : 'desconfirmou_agendamento', modulo: 'carro', paciente: item.paciente || '', dataRegistro: item.data || '', detalhes: `Horário: ${item.horario || ''}` });
            } catch (erro) {
                console.error(erro);
                item.confirmado = backup;
                atualizarTela();
                alert('Erro ao alterar confirmação: ' + erro.message);
            }
        }

        async function excluir(id) {
            const motivo = prompt('Motivo da exclusão:');
            if (motivo === null) return;

            const item = db.find(registro => registro.id === id);
            const backup = item ? { ...item } : null;

            if (item) {
                item.status = 'excluido';
                item.excluidoEm = new Date().toISOString();
                item.motivoExclusao = motivo.trim() || 'Sem motivo informado';
                atualizarTela();
            }

            try {
                await updateDoc(doc(firestore, COLECAO, id), {
                    status: 'excluido',
                    excluidoEm: Timestamp.now(),
                    motivoExclusao: motivo.trim() || 'Sem motivo informado'
                });

                await window.registrarLog?.({ acao: 'excluiu_agendamento', modulo: 'carro', paciente: backup?.paciente || '', dataRegistro: backup?.data || '', detalhes: motivo.trim() || 'Sem motivo informado' });
                mostrarStatus('Paciente marcado como excluído.');
            } catch (erro) {
                console.error(erro);

                if (backup) {
                    const index = db.findIndex(registro => registro.id === id);
                    if (index >= 0) db[index] = backup;
                    atualizarTela();
                }

                alert('Erro ao excluir: ' + erro.message);
            }
        }

        // =====================================================
        // LISTA E RELATÓRIO
        // =====================================================
        function abrirListaConfirmacao() {
            if (!el.data.value) {
                alert('Escolha a data no calendário!');
                return;
            }

            listaAberta = true;
            el.listaConfirmacao.style.display = 'block';
            renderizarLista();
        }

        function tabela(lista) {
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Hora</th>
                            <th>Paciente</th>
                            <th>Buscar em</th>
                            <th>Destino</th>
                            <th>Telefone</th>
                            <th>Vagas</th>
                            <th>Carro baixo</th>
                            <th>Criança</th>
                            <th>Fixo</th>
                            <th>Obs.</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            for (const item of lista) {
                html += `
                    <tr>
                        <td><b>${item.horario || ''}</b></td>
                        <td>${item.paciente || ''}</td>
                        <td>${item.localBusca || ''}</td>
                        <td>${item.lugar || ''}</td>
                        <td>${item.telefone || ''}</td>
                        <td style="text-align:center">${pesoVagas(item)}${item.acompanhante === 'SIM' ? ' (ACOMP.)' : ''}${item.crianca === 'SIM' ? ' + CRIANÇA' : ''}</td>
                        <td style="text-align:center">${item.carroBaixo === 'SIM' ? 'SIM' : 'NÃO'}</td>
                        <td style="text-align:center">${item.crianca === 'SIM' ? 'SIM' : 'NÃO'}</td>
                        <td style="text-align:center">${item.fixo === 'SIM' ? 'SIM' : 'NÃO'}</td>
                        <td>${item.obs || ''}</td>
                    </tr>
                `;
            }

            html += `
                    </tbody>
                </table>
            `;

            return html;
        }

        function blocoCarro(carro) {
            const vagas = vagasUsadas(carro.pacientes);
            const destinos = [...new Set(carro.pacientes.map(item => normalizar(item.lugar)).filter(Boolean))].join(' / ');
            const tipo = carro.tipoPreferencial || 'A DEFINIR';

            return `
                <div style="border:1px solid #000;margin-top:12px;padding:8px;page-break-inside:avoid">
                    <div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:6px">
                        <div>
                            <h3 style="margin:0">CARRO ${carro.numero}</h3>
                            <div style="font-size:12px;margin-top:3px">
                                <b>Motorista:</b> ____________________
                                &nbsp;&nbsp;
                                <b>Carro:</b> ____________________
                                &nbsp;&nbsp;
                                <b>Tipo:</b> ${tipo}
                            </div>
                        </div>
                        <div style="text-align:right;font-size:12px">
                            <b>Vagas:</b> ${vagas}/${capacidadePorCarro}<br>
                            <b>Destino(s):</b> ${destinos || 'A DEFINIR'}
                        </div>
                    </div>
                    ${tabela(carro.pacientes)}
                </div>
            `;
        }

        function viaRelatorio(carros, via, dataBr, confirmados) {
            const blocos = carros.map(carro => blocoCarro(carro)).join('');

            return `
                <div class="onibus-section">
                    <div class="header-print">
                        <div>
                            <h2 style="margin:0">${via} - DATA: ${dataBr} - CARROS</h2>
                            <div style="font-size:13px;margin-top:4px">
                                Separado automaticamente por destino, janela máxima de 2 horas, capacidade configurada por carro e necessidade de carro baixo.
                            </div>
                        </div>
                        <h2 style="margin:0">CONFIRMADOS: ${confirmados}/${limiteCarro}</h2>
                    </div>
                    ${blocos}
                </div>
            `;
        }

        function gerarRelatorio() {
            if (!dataAtual) {
                alert('Escolha a data no calendário!');
                return;
            }

            const confirmadosLista = db.filter(item => item.status === 'ativo' && item.confirmado);

            if (confirmadosLista.length === 0) {
                alert('Nenhum paciente confirmado!');
                return;
            }

            const carros = montarCarros(confirmadosLista);
            const vagasConfirmadas = vagasUsadas(confirmadosLista);
            const dataBr = dataAtual.split('-').reverse().join('/');

            el.relatorioArea.innerHTML =
                viaRelatorio(carros, '1ª VIA', dataBr, vagasConfirmadas) +
                viaRelatorio(carros, '2ª VIA', dataBr, vagasConfirmadas);

            setTimeout(() => window.print(), 300);
        }

        // =====================================================
        // EVENTOS
        // =====================================================
        el.data.addEventListener('change', () => iniciarEscutaData(el.data.value));
        el.btnSalvar.addEventListener('click', salvar);
        el.btnCancelarEdicao.addEventListener('click', () => cancelarEdicao(true));
        el.btnVerLista.addEventListener('click', abrirListaConfirmacao);
        el.inputBusca.addEventListener('input', renderizarLista);
        el.btnGerarRelatorio.addEventListener('click', gerarRelatorio);
        el.btnAbrirConfig.addEventListener('click', alternarPainelConfiguracao);
        el.btnSalvarConfig.addEventListener('click', salvarConfiguracao);

        iniciarEscutaConfiguracao();
        renderizarPainel();
    </script>

<script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
    apiKey: "AIzaSyBEewfcj1MzE-OEoSv2YERkyU8TAXQZWFY",
    authDomain: "agendamento-a11d3.firebaseapp.com",
    projectId: "agendamento-a11d3",
    storageBucket: "agendamento-a11d3.firebasestorage.app",
    messagingSenderId: "31776903316",
    appId: "1:31776903316:web:73b72839fe54ce0d04a481"
};

    const appSeguranca = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const authSeguranca = getAuth(appSeguranca);
    const dbSeguranca = getFirestore(appSeguranca);

    function paginaAtual() {
        return window.location.pathname.split('/').pop() || 'index.html';
    }

    function criarBotaoSair(perfil) {
        if (document.getElementById('btnSairSistema')) return;

        const caixa = document.createElement('div');
        caixa.id = 'caixaUsuarioSistema';
        caixa.style.position = 'fixed';
        caixa.style.top = '12px';
        caixa.style.right = '12px';
        caixa.style.zIndex = '9999';
        caixa.style.display = 'flex';
        caixa.style.gap = '8px';
        caixa.style.alignItems = 'center';

        const badge = document.createElement('span');
        badge.textContent = (window.usuarioAtual?.nome || window.usuarioAtual?.usuario || 'Usuário') + ' • ' + perfil.toUpperCase();
        badge.style.background = '#0f172a';
        badge.style.color = 'white';
        badge.style.borderRadius = '8px';
        badge.style.padding = '8px 10px';
        badge.style.fontSize = '12px';
        badge.style.fontWeight = '700';

        const btn = document.createElement('button');
        btn.id = 'btnSairSistema';
        btn.textContent = 'Sair';
        btn.type = 'button';
        btn.style.background = '#dc2626';
        btn.style.color = 'white';
        btn.style.border = 'none';
        btn.style.borderRadius = '8px';
        btn.style.padding = '8px 12px';
        btn.style.fontWeight = '700';
        btn.style.cursor = 'pointer';
        btn.addEventListener('click', async () => {
            await signOut(authSeguranca);
            window.location.href = 'login.html';
        });

        caixa.appendChild(badge);
        caixa.appendChild(btn);
        document.body.appendChild(caixa);
    }

    function aplicarPermissoesVisuais(perfil) {
        const podeConfigurar = perfil === 'master' || perfil === 'admin';
        const btnConfig = document.getElementById('btnAbrirConfig');
        const painelConfig = document.getElementById('painelConfig');
        if (!podeConfigurar) {
            if (btnConfig) btnConfig.style.display = 'none';
            if (painelConfig) painelConfig.style.display = 'none';
        }

        const linksUsuarios = document.querySelectorAll('[data-master-only="true"]');
        linksUsuarios.forEach(el => el.style.display = perfil === 'master' ? '' : 'none');
    }

    window.usuarioAtual = null;
    window.perfilUsuario = null;
    window.podeConfigurarSistema = () => window.perfilUsuario === 'master' || window.perfilUsuario === 'admin';
    window.podeGerenciarUsuarios = () => window.perfilUsuario === 'master';

    window.registrarLog = async function(info) {
        try {
            if (!window.usuarioAtual) return;
            await addDoc(collection(dbSeguranca, 'logs'), {
                uid: window.usuarioAtual.uid,
                usuario: window.usuarioAtual.usuario || '',
                nomeUsuario: window.usuarioAtual.nome || '',
                email: window.usuarioAtual.email || '',
                perfil: window.usuarioAtual.perfil || '',
                acao: info.acao || 'acao',
                modulo: info.modulo || paginaAtual(),
                paciente: info.paciente || '',
                dataRegistro: info.dataRegistro || '',
                detalhes: info.detalhes || '',
                criadoEm: Timestamp.now()
            });
        } catch (erro) {
            console.error('Erro ao registrar log:', erro);
        }
    };

    onAuthStateChanged(authSeguranca, async (user) => {
        if (!user) {
            window.location.href = 'login.html?next=' + encodeURIComponent(paginaAtual());
            return;
        }

        const snap = await getDoc(doc(dbSeguranca, 'usuarios', user.uid));
        if (!snap.exists() || snap.data().ativo === false) {
            alert('Seu usuário não está cadastrado ou está desativado. Fale com o administrador master.');
            await signOut(authSeguranca);
            window.location.href = 'login.html';
            return;
        }

        if (snap.data().precisaTrocarSenha === true) {
            window.location.href = 'trocar_senha.html?next=' + encodeURIComponent(paginaAtual());
            return;
        }

        window.usuarioAtual = { uid: user.uid, email: user.email, ...snap.data() };
        window.perfilUsuario = window.usuarioAtual.perfil;
        criarBotaoSair(window.perfilUsuario);
        aplicarPermissoesVisuais(window.perfilUsuario);

        if (paginaAtual() === 'usuarios.html' && window.perfilUsuario !== 'master') {
            alert('Apenas o administrador master pode gerenciar usuários.');
            window.location.href = 'index.html';
        }
    });
</script>


<script>
// Padronização geral: letras maiúsculas, sem acentos e sem Ç nos campos de texto.
(function () {
    function padronizarTexto(valor) {
        return (valor || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[çÇ]/g, 'C')
            .toUpperCase();
    }

    function deveIgnorarCampo(campo) {
        const tipo = (campo.type || '').toLowerCase();
        return ['password', 'date', 'time', 'number', 'email', 'checkbox', 'radio', 'button', 'submit'].includes(tipo);
    }

    function aplicarPadrao(campo) {
        if (!campo || deveIgnorarCampo(campo)) return;
        if (!['INPUT', 'TEXTAREA'].includes(campo.tagName)) return;
        const inicio = campo.selectionStart;
        const fim = campo.selectionEnd;
        const novoValor = padronizarTexto(campo.value);
        if (campo.value !== novoValor) {
            campo.value = novoValor;
            try { campo.setSelectionRange(inicio, fim); } catch (e) {}
        }
    }

    document.addEventListener('input', function (evento) {
        aplicarPadrao(evento.target);
    });

    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('input, textarea').forEach(aplicarPadrao);
    });
})();
</script>
