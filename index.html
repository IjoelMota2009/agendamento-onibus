<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transporte Saúde - Gestão Final</title>
    <style>
        :root { --primary: #0056b3; --success: #28a745; --danger: #dc3545; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }

        .header { background: #1a1a1a; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .card h3 { margin-top: 0; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; color: var(--primary); }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }

        .search-box { margin-bottom: 15px; }
        .search-box input { border: 2px solid var(--primary); background: #f0f7ff; font-weight: bold; }

        .check-box-group { display: flex; gap: 10px; grid-column: span 2; }
        .check-box { flex: 1; display: flex; align-items: center; gap: 8px; background: #f9f9f9; padding: 10px; border-radius: 5px; border: 1px solid #eee; }

        .btn { padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; color: white; }
        .btn-save { background: var(--success); width: 100%; margin-top: 10px; }
        .btn-view { background: #4b5563; width: 100%; margin-top: 10px; }
        .btn-print { background: var(--primary); width: 100%; height: 50px; font-size: 16px; margin-top: 20px; }
        .btn-del { background: #fee2e2; color: #dc2626; padding: 5px 8px; border: 1px solid #fecaca; font-size: 11px; margin-left: 5px; }

        .vagas-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .vagas-box { padding: 15px; border-radius: 8px; text-align: center; color: white; }
        .manha { background: #0284c7; }
        .tarde { background: #d97706; }
        .vagas-numero { font-size: 22px; font-weight: bold; display: block; }

        #listaConfirmacao { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-top: 15px; display: none; }

        .item-confirmar {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            margin-bottom: 6px;
            background: #fff;
        }

        .nome-paciente { flex: 1; font-weight: 500; font-size: 15px; text-transform: uppercase; }
        .hora-paciente { width: 70px; text-align: center; font-weight: bold; color: #475569; background: #f1f5f9; padding: 4px; border-radius: 4px; margin: 0 10px; }
        .check-confirmar { width: 22px; height: 22px; cursor: pointer; margin-right: 10px; }

        .tag { font-size: 9px; font-weight: bold; padding: 2px 5px; border-radius: 3px; margin-left: 5px; vertical-align: middle; }
        .tag-londrina { color: #dc2626; border: 1px solid #dc2626; }
        .tag-acomp { color: #059669; border: 1px solid #059669; }

        .status-box { margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 14px; display: none; }
        .status-ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .status-erro { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

        @media print {
            .no-print { display: none !important; }
            body { padding: 0; background: white; }
            .onibus-section { page-break-before: always; border-bottom: 1px dashed #ccc; padding-bottom: 20px; margin-bottom: 20px; }
            .onibus-section:first-child { page-break-before: auto; }
            .onibus-section:last-child { border-bottom: none; }
            table { width: 100%; border-collapse: collapse; margin-top: 10px; }
            th, td { border: 1px solid #000; padding: 6px; text-align: left; font-size: 11px; }
            th { background: #f2f2f2 !important; -webkit-print-color-adjust: exact; }
            .header-print { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #000; padding-bottom: 5px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header no-print">
        <h1>SISTEMA DE TRANSPORTE - SAÚDE</h1>
    </div>

    <div class="main-grid no-print">
        <div class="card">
            <h3>1. Cadastrar Paciente</h3>
            <div class="form-row">
                <div style="grid-column: span 2;">
                    <label for="data">Data da Viagem:</label>
                    <input type="date" id="data" onchange="atualizarPainel()">
                </div>
                <div style="grid-column: span 2;">
                    <label for="paciente">Nome do Paciente:</label>
                    <input type="text" id="paciente" placeholder="Nome Completo">
                </div>
                <div>
                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone" placeholder="(00) 00000-0000">
                </div>
                <div>
                    <label for="lugar">Destino:</label>
                    <input type="text" id="lugar" placeholder="Ex: HC, HU, ICL">
                </div>
                <div>
                    <label for="horario">Horário da Consulta:</label>
                    <input type="time" id="horario">
                </div>
                <div>
                    <label for="obs">Observação:</label>
                    <input type="text" id="obs" placeholder="Vila, rua, referência...">
                </div>
                <div class="check-box-group">
                    <div class="check-box">
                        <input type="checkbox" id="acompanhante">
                        <label for="acompanhante">Com Acompanhante</label>
                    </div>
                    <div class="check-box">
                        <input type="checkbox" id="londrina">
                        <label for="londrina">Londrina</label>
                    </div>
                </div>
            </div>
            <button class="btn btn-save" onclick="salvar()">SALVAR AGENDAMENTO</button>
            <div id="statusMensagem" class="status-box"></div>
        </div>

        <div class="card">
            <h3>2. Controle do Dia</h3>
            <div id="statusData" style="text-align: center; font-weight: bold; margin-bottom: 15px; color: var(--primary);">Selecione uma data</div>

            <div class="vagas-container">
                <div class="vagas-box manha">
                    <span>ÔNIBUS 5H (consulta até 11:30)</span>
                    <span class="vagas-numero" id="vManha">0 / 32</span>
                </div>
                <div class="vagas-box tarde">
                    <span>ÔNIBUS 10H (consulta após 11:30)</span>
                    <span class="vagas-numero" id="vTarde">0 / 28</span>
                </div>
            </div>

            <button class="btn btn-view" onclick="abrirListaConfirmacao()">VER LISTA E PESQUISAR</button>

            <div id="listaConfirmacao">
                <div class="search-box">
                    <input type="text" id="inputBusca" onkeyup="filtrarNomes()" placeholder="🔍 Pesquisar nome na lista...">
                </div>
                <div id="corpoLista"></div>
                <button class="btn btn-print" onclick="gerarRelatorio()">GERAR PLANILHA PARA IMPRESSÃO</button>
            </div>
        </div>
    </div>

    <div id="relatorioArea"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
        query,
        where,
        updateDoc,
        doc,
        Timestamp,
        orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // COLE A CONFIGURAÇÃO DO SEU PROJETO FIREBASE AQUI.
    // Pegue isso no Firebase Console > Configurações do projeto > Seus apps > SDK setup and config.
    const firebaseConfig = {
    apiKey: "AIzaSyBEewfcj1MzE-OEoSv2YERkyU8TAXQZWFY",
    authDomain: "agendamento-a11d3.firebaseapp.com",
    projectId: "agendamento-a11d3",
    storageBucket: "agendamento-a11d3.firebasestorage.app",
    messagingSenderId: "31776903316",
    appId: "1:31776903316:web:73b72839fe54ce0d04a481"
    };

    const app = initializeApp(firebaseConfig);
    const firestore = getFirestore(app);

    const CORTE_ONIBUS = "11:30";
    const LIMITE_MANHA = 32;
    const LIMITE_TARDE = 28;

    let db = [];

    function mostrarStatus(texto, tipo = 'ok') {
        const box = document.getElementById('statusMensagem');
        box.textContent = texto;
        box.className = `status-box ${tipo === 'erro' ? 'status-erro' : 'status-ok'}`;
        box.style.display = 'block';
        setTimeout(() => {
            box.style.display = 'none';
        }, 4000);
    }

    function limparCampos() {
        document.getElementById('paciente').value = "";
        document.getElementById('telefone').value = "";
        document.getElementById('lugar').value = "";
        document.getElementById('obs').value = "";
        document.getElementById('horario').value = "";
        document.getElementById('acompanhante').checked = false;
        document.getElementById('londrina').checked = false;
    }

    function pesoRegistro(item) {
        return item.acompanhante === "SIM" ? 2 : 1;
    }

    function isTurnoManha(horario) {
        return horario <= CORTE_ONIBUS;
    }

    async function buscarAgendamentosPorData(data) {
        const q = query(
            collection(firestore, 'agendamentos'),
            where('data', '==', data),
            where('status', '==', 'ativo')
        );

        const snap = await getDocs(q);
        return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }

    async function salvar() {
        try {
            const data = document.getElementById('data').value;
            const paciente = document.getElementById('paciente').value.trim().toUpperCase();
            const temAcomp = document.getElementById('acompanhante').checked;
            const telefone = document.getElementById('telefone').value.trim();
            const lugar = document.getElementById('lugar').value.trim().toUpperCase();
            const horario = document.getElementById('horario').value;
            const obs = document.getElementById('obs').value.trim();
            const isLondrina = document.getElementById('londrina').checked;

            if (!data || !paciente || !horario) {
                alert('Preencha Nome, Data e Horário!');
                return;
            }

            const listaDia = await buscarAgendamentosPorData(data);

            const repetido = listaDia.find(i => i.paciente === paciente);
            if (repetido) {
                alert('ESTE PACIENTE JÁ ESTÁ CADASTRADO!');
                return;
            }

            const peso = temAcomp ? 2 : 1;
            const turnoAtual = isTurnoManha(horario) ? 'manha' : 'tarde';
            const ocupados = listaDia
                .filter(i => turnoAtual === 'manha' ? isTurnoManha(i.horario) : !isTurnoManha(i.horario))
                .reduce((soma, item) => soma + pesoRegistro(item), 0);

            const limite = turnoAtual === 'manha' ? LIMITE_MANHA : LIMITE_TARDE;
            if ((ocupados + peso) > limite) {
                alert('ÔNIBUS LOTADO!');
                return;
            }

            await addDoc(collection(firestore, 'agendamentos'), {
                data,
                paciente,
                acompanhante: temAcomp ? 'SIM' : 'NÃO',
                telefone,
                lugar,
                horario,
                obs,
                isLondrina,
                confirmado: false,
                status: 'ativo',
                criadoEm: Timestamp.now(),
                excluidoEm: null,
                motivoExclusao: null
            });

            limparCampos();
            await atualizarPainel();
            mostrarStatus('Agendamento salvo com sucesso.');
        } catch (erro) {
            console.error(erro);
            mostrarStatus('Erro ao salvar no Firebase. Veja o console.', 'erro');
        }
    }

    async function atualizarPainel() {
        try {
            const d = document.getElementById('data').value;
            if (!d) return;

            document.getElementById('statusData').innerText = 'DATA: ' + d.split('-').reverse().join('/');

            db = await buscarAgendamentosPorData(d);

            const m = db
                .filter(i => isTurnoManha(i.horario))
                .reduce((soma, item) => soma + pesoRegistro(item), 0);

            const t = db
                .filter(i => !isTurnoManha(i.horario))
                .reduce((soma, item) => soma + pesoRegistro(item), 0);

            document.getElementById('vManha').innerText = `${m} / ${LIMITE_MANHA}`;
            document.getElementById('vTarde').innerText = `${t} / ${LIMITE_TARDE}`;

            if (document.getElementById('listaConfirmacao').style.display === 'block') {
                await abrirListaConfirmacao();
            }
        } catch (erro) {
            console.error(erro);
            mostrarStatus('Erro ao carregar dados do Firebase.', 'erro');
        }
    }

    async function abrirListaConfirmacao() {
        try {
            const d = document.getElementById('data').value;
            if (!d) {
                alert('Escolha a data no calendário!');
                return;
            }

            db = await buscarAgendamentosPorData(d);
            db.sort((a, b) => a.horario.localeCompare(b.horario));

            document.getElementById('listaConfirmacao').style.display = 'block';
            const divLista = document.getElementById('corpoLista');
            divLista.innerHTML = '';

            db.forEach(i => {
                divLista.innerHTML += `
                    <div class="item-confirmar" data-nome="${i.paciente}">
                        <div class="nome-paciente">
                            ${i.paciente}
                            ${i.isLondrina ? '<span class="tag tag-londrina">LONDRINA</span>' : ''}
                            ${i.acompanhante === "SIM" ? '<span class="tag tag-acomp">+ACOMP</span>' : ''}
                        </div>
                        <div class="hora-paciente">${i.horario}</div>
                        <input type="checkbox" class="check-confirmar" ${i.confirmado ? 'checked' : ''} onchange="confirmarVaga('${i.id}', this.checked)">
                        <button class="btn btn-del" onclick="excluir('${i.id}')">Apagar</button>
                    </div>`;
            });
        } catch (erro) {
            console.error(erro);
            mostrarStatus('Erro ao abrir a lista.', 'erro');
        }
    }

    function filtrarNomes() {
        const busca = document.getElementById('inputBusca').value.toUpperCase();
        const itens = document.querySelectorAll('.item-confirmar');
        itens.forEach(item => {
            const nome = item.getAttribute('data-nome') || '';
            item.style.display = nome.indexOf(busca) > -1 ? 'flex' : 'none';
        });
    }

    async function confirmarVaga(id, valor) {
        try {
            await updateDoc(doc(firestore, 'agendamentos', id), {
                confirmado: valor
            });
        } catch (erro) {
            console.error(erro);
            mostrarStatus('Erro ao confirmar paciente.', 'erro');
        }
    }

    async function excluir(id) {
        try {
            const motivo = prompt('Motivo da exclusão:');
            if (motivo === null) return;

            await updateDoc(doc(firestore, 'agendamentos', id), {
                status: 'excluido',
                excluidoEm: Timestamp.now(),
                motivoExclusao: motivo.trim() || 'Sem motivo informado'
            });

            await atualizarPainel();
            mostrarStatus('Paciente marcado como excluído.');
        } catch (erro) {
            console.error(erro);
            mostrarStatus('Erro ao excluir paciente.', 'erro');
        }
    }

    function ordenar(lista) {
        return [...lista].sort((a, b) => {
            const turnoA = isTurnoManha(a.horario) ? 0 : 1;
            const turnoB = isTurnoManha(b.horario) ? 0 : 1;
            if (turnoA !== turnoB) return turnoA - turnoB;
            if (a.isLondrina !== b.isLondrina) return a.isLondrina ? 1 : -1;
            return a.lugar.localeCompare(b.lugar);
        });
    }

    function tabela(lista) {
        let txt = `<table><thead><tr><th>Hora</th><th>Paciente</th><th>Acomp.</th><th>Telefone</th><th>Destino</th><th>Observações</th></tr></thead><tbody>`;
        lista.forEach(i => {
            txt += `<tr>
                <td><b>${i.horario}</b></td>
                <td>${i.paciente}</td>
                <td style="text-align:center">${i.acompanhante}</td>
                <td>${i.telefone || ''}</td>
                <td>${i.isLondrina ? '[LONDRINA] ' : ''}${i.lugar || ''}</td>
                <td>${i.obs || ''}</td>
            </tr>`;
        });
        return txt + `</tbody></table>`;
    }

    async function gerarRelatorio() {
        try {
            const d = document.getElementById('data').value;
            if (!d) {
                alert('Escolha a data no calendário!');
                return;
            }

            db = await buscarAgendamentosPorData(d);
            const confirmados = db.filter(i => i.confirmado);

            if (confirmados.length === 0) {
                alert('Nenhum paciente marcado com OK!');
                return;
            }

            const m = ordenar(confirmados.filter(i => isTurnoManha(i.horario)));
            const t = ordenar(confirmados.filter(i => !isTurnoManha(i.horario)));

            let h = '';
            const dataBr = d.split('-').reverse().join('/');

            if (m.length > 0) {
                const contaM = m.reduce((soma, item) => soma + pesoRegistro(item), 0);
                h += `<div class="onibus-section">
                        <div class="header-print">
                            <h2 style="margin:0">DATA: ${dataBr} - ÔNIBUS 5H</h2>
                            <h2 style="margin:0">OCUPAÇÃO: ${contaM}/${LIMITE_MANHA}</h2>
                        </div>
                        ${tabela(m)}
                      </div>`;
            }
            if (t.length > 0) {
                const contaT = t.reduce((soma, item) => soma + pesoRegistro(item), 0);
                h += `<div class="onibus-section">
                        <div class="header-print">
                            <h2 style="margin:0">DATA: ${dataBr} - ÔNIBUS 10H</h2>
                            <h2 style="margin:0">OCUPAÇÃO: ${contaT}/${LIMITE_TARDE}</h2>
                        </div>
                        ${tabela(t)}
                      </div>`;
            }

            document.getElementById('relatorioArea').innerHTML = h;
            setTimeout(() => window.print(), 500);
        } catch (erro) {
            console.error(erro);
            mostrarStatus('Erro ao gerar relatório.', 'erro');
        }
    }

    window.salvar = salvar;
    window.atualizarPainel = atualizarPainel;
    window.abrirListaConfirmacao = abrirListaConfirmacao;
    window.filtrarNomes = filtrarNomes;
    window.confirmarVaga = confirmarVaga;
    window.excluir = excluir;
    window.gerarRelatorio = gerarRelatorio;
</script>

</body>
</html>
