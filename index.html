<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transporte Saúde</title>
  <style>
    body { font-family:'Segoe UI',sans-serif; background:#f4f7f6; margin:0; padding:20px; }
    .container { max-width:700px; margin:80px auto; background:white; padding:30px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); text-align:center; }
    h1 { color:#0056b3; margin-bottom:10px; }
    p { color:#555; margin-bottom:30px; }
    .menu {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    justify-items: center;
    }
    .menu a {
    width: 100%;
    max-width: 250px;
    text-align: center;
    }
    a { text-decoration:none; padding:25px; border-radius:10px; color:white; font-size:22px; font-weight:bold; transition:.2s; display:block; }
    .onibus { background:#0284c7; }
    .carro { background:#16a34a; }
    a:hover { transform:scale(1.03); opacity:.9; }
    @media (max-width:600px) { .menu { grid-template-columns:1fr; } .container { margin-top:40px; } }
    .hemo {
    grid-column: span 2; /* ocupa as duas colunas */
    max-width: 300px;   /* deixa menor e centralizado */
    background: #9333ea;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Sistema de Transporte Saúde</h1>
  <p>Selecione o tipo de agendamento</p>
  <div class="menu">
    <a class="onibus" href="onibus.html">Ônibus</a>
    <a class="carro" href="carro.html">Carro</a>
    <a class="hemo" href="hemodialise.html">Hemodiálise</a>
  </div>
</div>
</body>
</html>
